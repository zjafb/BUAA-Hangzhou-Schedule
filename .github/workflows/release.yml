name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get Version
        id: get_version
        run: echo "VERSION=$(grep 'project.version=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > androidApp/release.jks

      - name: Build Android
        env:
          SIGNING_KEY: release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
        run: |
          ./gradlew :androidApp:assembleRelease
          cp androidApp/build/outputs/apk/release/androidApp-release.apk \
            BUAA-Hangzhou-Android-v${{ steps.get_version.outputs.VERSION }}.apk

      - name: Upload Android Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: BUAA-Hangzhou-Android-v${{ steps.get_version.outputs.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
